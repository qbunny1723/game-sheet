<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>遊戲開發學習單</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #FAFAF8; --surface: #F3F2EE; --surface2: #ECEAE4;
    --border: rgba(0,0,0,0.10); --border2: rgba(0,0,0,0.18);
    --text: #1A1A17; --text2: #5A5A54; --text3: #8A8A82;
    --purple-bg: #EEEDFE; --purple-text: #3C3489;
    --teal-bg: #E1F5EE;   --teal-text: #085041;
    --coral-bg: #FAECE7;  --coral-text: #713B13;
    --blue-bg: #E6F1FB;   --blue-text: #0C447C;
    --green-bg: #EAF3DE;  --green-text: #27500A;
    --purple-dot: #534AB7; --teal-dot: #0F6E56; --coral-dot: #993C1D;
    --blue-dot: #185FA5;   --green-dot: #3B6D11;
  }
  body { font-family: 'Noto Sans TC', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .page-wrap { max-width: 820px; margin: 0 auto; padding: 3rem 2rem 4rem; }

  /* ILLUSTRATION */
  .cover-illustration { width: 100%; margin-bottom: 2rem; position: relative; overflow: visible; }
  .cover-illustration svg { width: 100%; height: auto; display: block; }
  .week-icon { flex-shrink: 0; width: 36px; height: 36px; }
  .week-icon svg { width: 36px; height: 36px; display: block; }

  .page-header { display: flex; align-items: flex-start; gap: 1.5rem; margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
  .header-accent { width: 5px; height: 80px; border-radius: 3px; background: linear-gradient(180deg, #534AB7 0%, #1D9E75 100%); flex-shrink: 0; margin-top: 4px; }
  .header-text .eyebrow { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.14em; color: var(--text3); text-transform: uppercase; margin-bottom: 6px; }
  .header-text h1 { font-size: 26px; font-weight: 700; line-height: 1.2; letter-spacing: -0.02em; margin-bottom: 6px; }
  .header-text .subtitle { font-size: 14px; color: var(--text2); }
  .header-right { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex-shrink: 0; }
  .group-id-box { background: var(--surface2); border-radius: 8px; padding: 8px 12px; text-align: right; }
  .group-id-box .gid-label { font-size: 10px; color: var(--text3); font-family: 'Space Mono', monospace; letter-spacing: 0.08em; display: block; margin-bottom: 3px; }
  .group-id-box .gid-value { font-family: 'Space Mono', monospace; font-size: 16px; font-weight: 700; color: var(--text); letter-spacing: 0.12em; }
  .header-badges { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .header-badges span { font-family: 'Space Mono', monospace; font-size: 10px; background: var(--surface2); padding: 3px 10px; border-radius: 20px; color: var(--text2); }

  .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 2rem; }
  .info-field { background: var(--surface); border-radius: 10px; padding: 12px 14px; }
  .info-field label { display: block; font-size: 11px; font-weight: 500; color: var(--text3); letter-spacing: 0.05em; margin-bottom: 6px; }
  .info-field input { width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--border2); font-family: 'Noto Sans TC', sans-serif; font-size: 14px; color: var(--text); padding: 3px 0; outline: none; transition: border-color 0.15s; }
  .info-field input:focus { border-bottom-color: #534AB7; }
  .info-field input::placeholder { color: var(--text3); }

  .week-section { margin-bottom: 16px; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; transition: box-shadow 0.2s; }
  .week-section:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
  .week-header { display: flex; align-items: center; gap: 12px; padding: 14px 18px; cursor: pointer; user-select: none; background: #fff; transition: background 0.15s; }
  .week-header:hover { background: var(--surface); }
  .week-badge { font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700; padding: 4px 12px; border-radius: 20px; white-space: nowrap; letter-spacing: 0.04em; flex-shrink: 0; }
  .w1 { background: var(--purple-bg); color: var(--purple-text); }
  .w2 { background: var(--teal-bg);   color: var(--teal-text); }
  .w3 { background: var(--coral-bg);  color: var(--coral-text); }
  .w4 { background: var(--blue-bg);   color: var(--blue-text); }
  .w5 { background: var(--green-bg);  color: var(--green-text); }
  .week-title { font-size: 15px; font-weight: 500; flex: 1; }
  .week-theme { font-size: 12px; color: var(--text3); font-family: 'Space Mono', monospace; flex-shrink: 0; }
  .chevron { color: var(--text3); font-size: 11px; transition: transform 0.25s; flex-shrink: 0; }
  .chevron.open { transform: rotate(180deg); }
  .week-body { display: none; padding: 0 18px 20px; border-top: 1px solid var(--border); background: #fff; }
  .week-body.open { display: block; }

  .section-label { font-size: 11px; font-weight: 500; color: var(--text3); letter-spacing: 0.1em; text-transform: uppercase; margin: 16px 0 8px; display: flex; align-items: center; gap: 8px; }
  .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .task-list { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
  .task-list li { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; color: var(--text2); padding: 6px 8px 6px 0; line-height: 1.5; }
  .task-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; margin-top: 6px; }
  .dp { background: var(--purple-dot); } .dt { background: var(--teal-dot); }
  .dc { background: var(--coral-dot); } .db { background: var(--blue-dot); } .dg { background: var(--green-dot); }

  .qa-block { margin-top: 14px; }
  .qa-label { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 7px; line-height: 1.5; }
  .qa-wrap { position: relative; }
  .qa-block textarea { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px 26px; font-family: 'Noto Sans TC', sans-serif; font-size: 13px; color: var(--text); resize: vertical; outline: none; line-height: 1.7; transition: border-color 0.15s, background 0.15s; }
  .qa-block textarea:focus { border-color: #534AB7; background: #fff; }
  .qa-block textarea::placeholder { color: var(--text3); font-size: 12px; }
  .word-count { position: absolute; bottom: 7px; right: 10px; font-size: 11px; color: var(--text3); font-family: 'Space Mono', monospace; pointer-events: none; }
  .word-count.warn { color: #BA7517; }

  .qa-block textarea.code-input { font-family: 'Space Mono', monospace; font-size: 12px; line-height: 1.6; background: #F0EFF8; border-color: rgba(83,74,183,0.2); }
  .qa-block textarea.code-input:focus { border-color: #534AB7; background: #F8F7FD; }

  .ai-block { margin-top: 10px; border: 1px solid rgba(83,74,183,0.2); border-radius: 10px; overflow: hidden; }
  .ai-block-header { background: #EEEDFE; padding: 8px 14px; display: flex; align-items: center; gap: 8px; }
  .ai-block-title { font-size: 12px; font-weight: 500; color: var(--purple-text); }
  .ai-block-body { display: grid; grid-template-columns: 1fr 1fr; }
  .ai-col { padding: 12px 14px; }
  .ai-col:first-child { border-right: 1px solid rgba(83,74,183,0.12); }
  .ai-col-label { font-size: 11px; color: var(--text3); margin-bottom: 6px; font-weight: 500; letter-spacing: 0.04em; }
  .ai-col textarea { width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--border2); font-family: 'Noto Sans TC', sans-serif; font-size: 12px; color: var(--text); resize: vertical; outline: none; line-height: 1.6; min-height: 80px; transition: border-color 0.15s; }
  .ai-col textarea:focus { border-bottom-color: #534AB7; }
  .ai-col textarea::placeholder { color: var(--text3); font-size: 11px; }

  .member-table-wrap { margin-top: 8px; overflow-x: auto; }
  .member-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .member-table th { background: var(--surface2); color: var(--text2); font-weight: 500; font-size: 11px; letter-spacing: 0.04em; padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border2); white-space: nowrap; }
  .member-table td { padding: 3px 4px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .member-table td input { width: 100%; background: transparent; border: none; font-family: 'Noto Sans TC', sans-serif; font-size: 13px; color: var(--text); padding: 5px 6px; outline: none; border-radius: 4px; transition: background 0.15s; }
  .member-table td input:focus { background: var(--surface); }
  .member-table td input::placeholder { color: var(--text3); }

  .code-snippet { border: 1px solid rgba(83,74,183,0.18); border-radius: 10px; overflow: hidden; margin-top: 10px; }
  .code-snippet-header { background: #F0EFF8; padding: 6px 12px; display: flex; align-items: center; gap: 8px; }
  .code-snippet-num { font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 700; color: #534AB7; background: #DDDAF5; padding: 2px 7px; border-radius: 4px; }
  .code-snippet-name-input { flex: 1; background: transparent; border: none; font-family: 'Space Mono', monospace; font-size: 12px; color: #3C3489; outline: none; }
  .code-snippet-name-input::placeholder { color: rgba(83,74,183,0.4); }
  .code-snippet-body { padding: 0; }
  .code-snippet-body textarea { width: 100%; background: transparent; border: none; border-top: 1px solid rgba(83,74,183,0.12); font-family: 'Space Mono', monospace; font-size: 12px; color: var(--text); resize: vertical; outline: none; line-height: 1.6; padding: 10px 12px 26px; min-height: 90px; transition: background 0.15s; }
  .code-snippet-body textarea:focus { background: #FAFAFD; }
  .code-snippet-body textarea::placeholder { color: var(--text3); font-size: 11px; }
  .code-snippet-explain { padding: 8px 12px 10px; border-top: 1px solid rgba(83,74,183,0.12); background: #FAFAFD; }
  .code-snippet-explain-label { font-size: 10px; font-weight: 500; color: #534AB7; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 5px; }
  .code-snippet-explain textarea { width: 100%; background: transparent; border: none; font-family: 'Noto Sans TC', sans-serif; font-size: 12px; color: var(--text); resize: vertical; outline: none; line-height: 1.6; min-height: 52px; border-bottom: 1px solid rgba(83,74,183,0.15); padding-bottom: 4px; transition: border-color 0.15s; }
  .code-snippet-explain textarea:focus { border-bottom-color: #534AB7; }
  .code-snippet-explain textarea::placeholder { color: var(--text3); font-size: 11px; }
  .code-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
  .code-tag { font-family: 'Space Mono', monospace; font-size: 11px; background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 2px 8px; color: var(--text2); }

  .summary-block { margin-top: 10px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .summary-block-header { background: var(--surface2); padding: 7px 14px; display: flex; align-items: center; gap: 8px; }
  .summary-block-title { font-size: 11px; font-weight: 500; color: var(--text2); letter-spacing: 0.06em; text-transform: uppercase; }
  .summary-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .summary-table th { background: var(--surface); color: var(--text3); font-weight: 500; font-size: 10px; letter-spacing: 0.06em; padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; text-transform: uppercase; }
  .summary-table th.active-week { color: var(--text); background: var(--surface2); }
  .summary-table td { padding: 6px 10px; border-bottom: 1px solid var(--border); vertical-align: top; font-size: 12px; color: var(--text2); line-height: 1.5; }
  .summary-table td.name-cell { font-weight: 500; color: var(--text); white-space: nowrap; width: 90px; }
  .summary-table td.active-cell { background: rgba(83,74,183,0.03); color: var(--text); }
  .summary-table td.empty-cell { color: var(--text3); font-style: italic; font-size: 11px; }
  .summary-table tr:last-child td { border-bottom: none; }

  .bottom-bar { margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .bottom-note { font-size: 12px; color: var(--text3); line-height: 1.8; }
  .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn { font-family: 'Noto Sans TC', sans-serif; font-size: 13px; padding: 9px 18px; border-radius: 8px; cursor: pointer; transition: all 0.15s; border: 1px solid var(--border2); background: transparent; color: var(--text); }
  .btn:hover { background: var(--surface); }
  .btn-primary { background: #1A1A17; color: #fff; border-color: #1A1A17; }
  .btn-primary:hover { background: #333; }
  .btn-danger { color: #A32D2D; border-color: rgba(163,45,45,0.3); }
  .btn-danger:hover { background: #FCEBEB; }
  .btn:disabled { opacity: 0.55; cursor: wait; }
  .submit-msg { margin-top: 12px; font-size: 13px; line-height: 1.7; text-align: right; min-height: 20px; }
  .submit-msg.ok { color: #0C447C; }
  .submit-msg.err { color: #A32D2D; }
  @media print { .submit-msg { display: none; } }

  @media print {
    @page { size: A4; margin: 18mm 16mm; }
    body { background: #fff; }
    .page-wrap { padding: 0; max-width: 100%; }
    .bottom-bar { display: none; }
    .chevron { display: none; }
    .cover-illustration { margin-bottom: 1rem; }
    .cover-illustration svg { height: 120px; }
    .page-header { break-after: avoid; margin-bottom: 1.2rem; padding-bottom: 1rem; }
    .info-grid { break-after: avoid; margin-bottom: 1.2rem; }
    .week-section { break-before: page; break-inside: auto; box-shadow: none; border: 1px solid #ddd; border-radius: 10px; overflow: hidden; margin-bottom: 0; }
    .week-section:first-child { break-before: avoid; }
    .week-header { background: var(--surface) !important; padding: 10px 16px; }
    .week-body { display: block !important; padding: 0 16px 16px; }
    .qa-block { break-inside: avoid; margin-top: 12px; }
    .qa-block textarea { min-height: 60px; background: #F7F7F5 !important; border: 1px solid #ddd !important; border-radius: 6px; padding-bottom: 10px; }
    .ai-block { break-inside: avoid; }
    .ai-col textarea { min-height: 60px; background: #F7F7F5; border-bottom: 1px solid #ddd !important; }
    .member-table-wrap { break-inside: avoid; }
    .task-list { break-inside: avoid; }
    .section-label { break-after: avoid; }
    .word-count { display: none; }
    .code-tags { display: none; }
  }

  @media (max-width: 620px) {
    .page-wrap { padding: 1.5rem 1rem 3rem; }
    .info-grid { grid-template-columns: 1fr; }
    .task-list { grid-template-columns: 1fr; }
    .header-right { display: none; }
    .ai-block-body { grid-template-columns: 1fr; }
    .ai-col:first-child { border-right: none; border-bottom: 1px solid rgba(83,74,183,0.12); }
  }
</style>
</head>
<body>
<div class="page-wrap">

  <div class="cover-illustration">
<svg viewBox="0 0 820 200" xmlns="http://www.w3.org/2000/svg" style="font-family:'Space Mono',monospace">
  <defs>
    <filter id="sketch" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" seed="2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- Notebook lines background -->
  <rect x="0" y="0" width="820" height="200" fill="#FAFAF8" rx="12"/>
  <line x1="0" y1="32" x2="820" y2="32" stroke="#E8E6E0" stroke-width="0.8"/>
  <line x1="0" y1="56" x2="820" y2="56" stroke="#E8E6E0" stroke-width="0.8"/>
  <line x1="0" y1="80" x2="820" y2="80" stroke="#E8E6E0" stroke-width="0.8"/>
  <line x1="0" y1="104" x2="820" y2="104" stroke="#E8E6E0" stroke-width="0.8"/>
  <line x1="0" y1="128" x2="820" y2="128" stroke="#E8E6E0" stroke-width="0.8"/>
  <line x1="0" y1="152" x2="820" y2="152" stroke="#E8E6E0" stroke-width="0.8"/>
  <line x1="0" y1="176" x2="820" y2="176" stroke="#E8E6E0" stroke-width="0.8"/>
  <!-- Margin line -->
  <line x1="52" y1="0" x2="52" y2="200" stroke="#F0B8C0" stroke-width="1.2"/>

  <!-- ── FLOWCHART CHARACTER (left) ── -->
  <g filter="url(#sketch)" transform="translate(68,14)">
    <!-- little robot head -->
    <rect x="18" y="4" width="34" height="28" rx="5" fill="none" stroke="#534AB7" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- eyes -->
    <circle cx="28" cy="16" r="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.8"/>
    <circle cx="42" cy="16" r="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.8"/>
    <circle cx="28" cy="16" r="1.5" fill="#534AB7"/>
    <circle cx="42" cy="16" r="1.5" fill="#534AB7"/>
    <!-- antenna -->
    <line x1="35" y1="4" x2="35" y2="-4" stroke="#534AB7" stroke-width="2" stroke-linecap="round"/>
    <circle cx="35" cy="-6" r="3" fill="#534AB7"/>
    <!-- body -->
    <rect x="22" y="34" width="26" height="20" rx="4" fill="none" stroke="#534AB7" stroke-width="2" stroke-linejoin="round"/>
    <!-- arms -->
    <line x1="22" y1="38" x2="10" y2="46" stroke="#534AB7" stroke-width="2" stroke-linecap="round"/>
    <line x1="48" y1="38" x2="60" y2="46" stroke="#534AB7" stroke-width="2" stroke-linecap="round"/>
    <!-- legs -->
    <line x1="30" y1="54" x2="27" y2="70" stroke="#534AB7" stroke-width="2" stroke-linecap="round"/>
    <line x1="40" y1="54" x2="43" y2="70" stroke="#534AB7" stroke-width="2" stroke-linecap="round"/>
    <!-- feet -->
    <ellipse cx="27" cy="72" rx="6" ry="3" fill="none" stroke="#534AB7" stroke-width="1.8"/>
    <ellipse cx="43" cy="72" rx="6" ry="3" fill="none" stroke="#534AB7" stroke-width="1.8"/>
    <!-- speech bubble -->
    <path d="M62 2 Q110 2 110 22 Q110 40 80 40 L72 48 L76 40 Q62 40 62 22 Z" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.8" stroke-linejoin="round"/>
    <text x="86" y="17" text-anchor="middle" font-size="8" fill="#3C3489" font-weight="bold">def play()</text>
    <text x="86" y="29" text-anchor="middle" font-size="7.5" fill="#534AB7">→ 開始！</text>
  </g>

  <!-- ── FLOWCHART in middle ── -->
  <g filter="url(#sketch)" transform="translate(260,10)">
    <!-- START box -->
    <rect x="60" y="0" width="70" height="26" rx="13" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2"/>
    <text x="95" y="17" text-anchor="middle" font-size="11" fill="#085041" font-weight="bold">開始</text>
    <!-- arrow down -->
    <line x1="95" y1="26" x2="95" y2="46" stroke="#0F6E56" stroke-width="2" stroke-linecap="round"/>
    <polygon points="95,50 90,42 100,42" fill="#0F6E56"/>
    <!-- PROCESS box -->
    <rect x="50" y="50" width="90" height="26" rx="4" fill="#FAFAF8" stroke="#0F6E56" stroke-width="2"/>
    <text x="95" y="67" text-anchor="middle" font-size="10" fill="#085041">設計規則</text>
    <!-- arrow -->
    <line x1="95" y1="76" x2="95" y2="96" stroke="#0F6E56" stroke-width="2" stroke-linecap="round"/>
    <polygon points="95,100 90,92 100,92" fill="#0F6E56"/>
    <!-- DECISION diamond -->
    <polygon points="95,100 145,126 95,152 45,126" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2"/>
    <text x="95" y="123" text-anchor="middle" font-size="9.5" fill="#085041">有bug?</text>
    <!-- YES right -->
    <line x1="145" y1="126" x2="185" y2="126" stroke="#993C1D" stroke-width="2" stroke-linecap="round"/>
    <polygon points="189,126 181,121 181,131" fill="#993C1D"/>
    <text x="165" y="120" text-anchor="middle" font-size="9" fill="#993C1D">YES</text>
    <rect x="189" y="113" width="52" height="26" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1.8"/>
    <text x="215" y="130" text-anchor="middle" font-size="9.5" fill="#713B13">除錯！</text>
    <!-- loop back up -->
    <path d="M241 126 Q265 126 265 60 Q265 -6 155 -6 Q135 -6 135 10 L135 26" fill="none" stroke="#993C1D" stroke-width="1.8" stroke-dasharray="5,3" stroke-linecap="round"/>
    <!-- NO down -->
    <line x1="95" y1="152" x2="95" y2="170" stroke="#0F6E56" stroke-width="2" stroke-linecap="round"/>
    <polygon points="95,174 90,166 100,166" fill="#0F6E56"/>
    <text x="106" y="166" font-size="9" fill="#085041">NO</text>
    <!-- END -->
    <rect x="60" y="174" width="70" height="24" rx="12" fill="#0F6E56" stroke="#0F6E56" stroke-width="2"/>
    <text x="95" y="190" text-anchor="middle" font-size="11" fill="white" font-weight="bold">上線！</text>
  </g>

  <!-- ── PYTHON CODE snippet (right) ── -->
  <g filter="url(#sketch)" transform="translate(580,12)">
    <rect x="0" y="0" width="210" height="155" rx="8" fill="#F0EFF8" stroke="#534AB7" stroke-width="2"/>
    <!-- title bar -->

const MEMBER_NAMES = ["第一位","第二位","第三位","第四位","第五位"];

function genGroupId() {
  const saved = localStorage.getItem(STORAGE_KEY + '_gid');
  if (saved) return saved;
  const C = 'ABCDEFGHJKLMNPQRSTUVWXYZ', N = '23456789';
  const id = C[Math.floor(Math.random()*C.length)] + C[Math.floor(Math.random()*C.length)] +
             '-' + N[Math.floor(Math.random()*N.length)] + N[Math.floor(Math.random()*N.length)] + N[Math.floor(Math.random()*N.length)];
  localStorage.setItem(STORAGE_KEY + '_gid', id);
  return id;
}

function attachWordCount(ta, el) {
  function upd() { const n = ta.value.replace(/\s/g,'').length; el.textContent = n+'字'; el.classList.toggle('warn', n>0&&n<30); }
  ta.addEventListener('input', upd); upd();
}

      </div>
      <div class="week-body${wi===0?' open':''}" id="body-${wi}">
        <div class="section-label">本週任務</div>
        <ul class="task-list">${tasksHtml}</ul>
        <div class="section-label">學習紀錄</div>
        ${qsHtml}${aiHtml}${codeHtml}${memberHtml}
      </div>`;
    container.appendChild(sec);
  });

  document.querySelectorAll('.qa-wrap').forEach(wrap => {
    const ta = wrap.querySelector('textarea');
    const wc = wrap.querySelector('.word-count');
    if (ta && wc) attachWordCount(ta, wc);
  });

  loadAll();
  document.addEventListener('input', e => {
    if (e.target.matches('input[data-mi]')) updateSummaryTable();
    debounce(saveAll, 800)(e);
  });
}

function updateSummaryTable() {
  const WEEK_COUNT = 5;

  // Collect all name→tasks mappings across all weeks, keyed by trimmed name
  // memberMap: { name: { w0: task, w1: task, ... } }
  const memberMap = {};
  const nameOrder = []; // preserve first-seen order

  for (let w = 0; w < WEEK_COUNT; w++) {
    document.querySelectorAll(`input[data-mw="${w}"][data-mc="0"]`).forEach(nameEl => {
      const name = nameEl.value.trim();
      if (!name) return;
      const ri = nameEl.dataset.mi;
      const taskEl = document.querySelector(`input[data-mw="${w}"][data-mi="${ri}"][data-mc="1"]`);
      const task = taskEl ? taskEl.value.trim() : '';
      if (!memberMap[name]) { memberMap[name] = {}; nameOrder.push(name); }
      // Only overwrite if this week's task is non-empty, so earlier entry doesn't wipe later
      if (task) memberMap[name][w] = task;
    });
  }

  // Rebuild every summary table (they all show same data; active-week highlight differs)
  weeks.forEach((_, wi) => {
    const tbl = document.getElementById('summary-' + wi);
    if (!tbl) return;

    let thead = '<thead><tr><th>組員</th>';
    for (let w = 0; w < WEEK_COUNT; w++) {
      const active = (w === wi) ? ' class="active-week"' : '';
      thead += `<th${active}>第${['一','二','三','四','五'][w]}週</th>`;
    }
    thead += '</tr></thead>';

    let tbody = '<tbody>';
    // Deduplicate nameOrder (same name may appear in multiple weeks)
    const seen = new Set();
    nameOrder.forEach(name => {
      if (seen.has(name)) return;
      seen.add(name);
      let row = `<tr><td class="name-cell">${name}</td>`;
      for (let w = 0; w < WEEK_COUNT; w++) {
        const val = (memberMap[name] && memberMap[name][w]) || '';
        const activeClass = (w === wi) ? 'active-cell' : '';
        const emptyClass = val ? '' : 'empty-cell';
        const cls = [activeClass, emptyClass].filter(Boolean).join(' ');
        row += `<td${cls ? ' class="'+cls+'"' : ''}>${val || '—'}</td>`;
      }
      row += '</tr>';
      tbody += row;
    });
    if (!seen.size) {
      tbody += `<tr><td colspan="${WEEK_COUNT+1}" style="padding:10px;color:var(--text3);font-size:12px">尚未填寫任何組員姓名</td></tr>`;
    }
    tbody += '</tbody>';
    tbl.innerHTML = thead + tbody;
  });
}

function toggleWeek(i) {
  const b = document.getElementById('body-'+i), c = document.getElementById('chev-'+i);
  const o = b.classList.toggle('open'); c.classList.toggle('open', o);
}
let allOpen = false;
function toggleAll() {
  allOpen = !allOpen;
  weeks.forEach((_,i) => {
    document.getElementById('body-'+i).classList.toggle('open', allOpen);
    document.getElementById('chev-'+i).classList.toggle('open', allOpen);
  });
}

function collectData() {
  const d = { info:{}, qa:{}, ai:{}, code:{}, member:{} };
  document.querySelectorAll('.info-field input[id]').forEach(el => { d.info[el.id] = el.value; });
  document.querySelectorAll('textarea[data-wi][data-qi]').forEach(el => { d.qa[el.dataset.wi+'_'+el.dataset.qi] = el.value; });
  document.querySelectorAll('textarea[data-ai]').forEach(el => { d.ai[el.dataset.wi+'_'+el.dataset.ai] = el.value; });
  document.querySelectorAll('textarea[data-code]').forEach(el => { d.code[el.dataset.wi+'_'+el.dataset.code] = el.value; });
  document.querySelectorAll('input[data-csn]').forEach(el => { d.csn = d.csn||{}; d.csn[el.dataset.wi+'_'+el.dataset.csn] = el.value; });
  document.querySelectorAll('textarea[data-cse]').forEach(el => { d.cse = d.cse||{}; d.cse[el.dataset.wi+'_'+el.dataset.cse] = el.value; });
  document.querySelectorAll('input[data-mi]').forEach(el => { d.member[el.dataset.mw+'_'+el.dataset.mi+'_'+el.dataset.mc] = el.value; });
  return d;
}

function saveAll() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(collectData()));
    const s = document.getElementById('save-status');
    if (s) { const t = new Date(); s.textContent = '✓ 已儲存　'+t.getHours().toString().padStart(2,'0')+':'+t.getMinutes().toString().padStart(2,'0'); }
  } catch(e) {}
}

function loadAll() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d.info) Object.entries(d.info).forEach(([k,v]) => { const el = document.getElementById(k); if(el) el.value=v; });
    if (d.qa) Object.entries(d.qa).forEach(([k,v]) => { const [wi,qi]=k.split('_'); const el=document.querySelector(`textarea[data-wi="${wi}"][data-qi="${qi}"]`); if(el){el.value=v;el.dispatchEvent(new Event('input'));} });
    if (d.ai) Object.entries(d.ai).forEach(([k,v]) => { const parts=k.split('_'); const el=document.querySelector(`textarea[data-wi="${parts[0]}"][data-ai="${parts[1]}"]`); if(el) el.value=v; });
    if (d.code) Object.entries(d.code).forEach(([k,v]) => { const [wi,cn]=k.split('_'); const el=document.querySelector(`textarea[data-wi="${wi}"][data-code="${cn}"]`); if(el){el.value=v;el.dispatchEvent(new Event('input'));} });
    if (d.csn) Object.entries(d.csn).forEach(([k,v]) => { const [wi,n]=k.split('_'); const el=document.querySelector(`input[data-wi="${wi}"][data-csn="${n}"]`); if(el) el.value=v; });
    if (d.cse) Object.entries(d.cse).forEach(([k,v]) => { const [wi,n]=k.split('_'); const el=document.querySelector(`textarea[data-wi="${wi}"][data-cse="${n}"]`); if(el) el.value=v; });
    if (d.member) Object.entries(d.member).forEach(([k,v]) => { const [mw,mi,mc]=k.split('_'); const el=document.querySelector(`input[data-mw="${mw}"][data-mi="${mi}"][data-mc="${mc}"]`); if(el) el.value=v; });
    updateGroupId();
    updateSummaryTable();
  } catch(e) {}
}

// 把畫面上所有填寫內容整理成「一組一列」的扁平資料
function buildSubmission() {
  const val = (sel) => { const el = document.querySelector(sel); return el ? el.value.trim() : ''; };
  const out = {
    '組別名稱': val('#info-0'),
    '組員姓名': val('#info-1'),
    '遊戲名稱': val('#info-2'),
    '遊戲類型': val('#info-3'),
    '組別代碼': (document.getElementById('group-id-display') || {}).textContent || ''
  };
  weeks.forEach((w, wi) => {
    const p = '第' + ['一','二','三','四','五'][wi] + '週_';
    w.qs.forEach((q, qi) => {
      out[p + 'Q' + (qi + 1) + ' ' + q.label] = val(`textarea[data-wi="${wi}"][data-qi="${qi}"]`);
    });
    if (w.hasAI) {
      out[p + 'AI指令'] = val(`textarea[data-wi="${wi}"][data-ai="prompt"]`);
      out[p + 'AI回覆'] = val(`textarea[data-wi="${wi}"][data-ai="reply"]`);
    }
    if (w.hasCode) {
      [1, 2, 3].forEach(n => {
        out[p + '程式碼' + n + '_名稱'] = val(`input[data-wi="${wi}"][data-csn="${n}"]`);
        out[p + '程式碼' + n + '_內容'] = val(`textarea[data-wi="${wi}"][data-code="${n}"]`);
        out[p + '程式碼' + n + '_說明'] = val(`textarea[data-wi="${wi}"][data-cse="${n}"]`);
      });
    }
    const lines = [];
    MEMBER_NAMES.forEach((_, ri) => {
      const n = val(`input[data-mw="${wi}"][data-mi="${ri}"][data-mc="0"]`);
      const t = val(`input[data-mw="${wi}"][data-mi="${ri}"][data-mc="1"]`);
      if (n || t) lines.push(n + '：' + t);
    });
    out[p + '組員分工'] = lines.join('\n');
  });
  return out;
}

async function submitAll() {
  const msg = document.getElementById('submit-msg');
  const btn = document.getElementById('submit-btn');
  const setMsg = (t, c) => { msg.textContent = t; msg.className = 'submit-msg ' + (c || ''); };

  if (!SUBMIT_URL) { setMsg('老師尚未設定收件網址，請先改用「列印 / 存成 PDF」繳交。', 'err'); return; }
  const data = buildSubmission();
  if (!data['組別名稱']) {
    setMsg('請先在最上方填寫「組別名稱」，老師才知道是哪一組。', 'err');
    document.getElementById('info-0').focus();
    return;
  }
  if (!confirm('確定要送出「' + data['組別名稱'] + '」目前的內容嗎？\n之後可以再送出，同一組會覆蓋舊的內容。')) return;

  btn.disabled = true;
  setMsg('送出中…請稍候，不要關閉網頁');
  saveAll();
  try {
    // 用 text/plain 可避免瀏覽器的跨網域預檢請求（Apps Script 不支援）
    const res = await fetch(SUBMIT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(data)
    });
    const r = await res.json();
    if (!r.ok) throw new Error(r.error || '伺服器回傳錯誤');
    const t = new Date();
    setMsg('✓ 已送出　' + t.getHours().toString().padStart(2,'0') + ':' + t.getMinutes().toString().padStart(2,'0') + '（可再次送出更新內容）', 'ok');
  } catch (e) {
    setMsg('送出失敗：' + e.message + '。請確認網路後再按一次；若仍失敗，請先「列印 / 存成 PDF」備份並告知老師。', 'err');
  } finally {
    btn.disabled = false;
  }
}

function clearData() {
  if (!confirm('確定要清除所有填寫內容嗎？組別代碼會保留，此操作無法復原。')) return;
  localStorage.removeItem(STORAGE_KEY);
  document.querySelectorAll('.info-field input').forEach(el=>el.value='');
  document.querySelectorAll('textarea').forEach(el=>{el.value='';el.dispatchEvent(new Event('input'));});
  document.querySelectorAll('.member-table input').forEach(el=>el.value='');
  const s=document.getElementById('save-status'); if(s) s.textContent='已清除所有資料';
}

function updateGroupId() {
  const name = (document.getElementById('info-0')||{}).value||'';
  const el = document.getElementById('group-id-display');
  if (el) el.textContent = (name ? name.slice(0,5)+'・' : '') + genGroupId();
}

function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};}

document.getElementById('group-id-display').textContent = genGroupId();
build();
document.getElementById('info-0').addEventListener('input', updateGroupId);
</script>
